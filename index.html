<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Cyber Grid Background Only</title>
    <style>
        /* Forces the canvas to be a clean, zero-margin background layer */
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #02050a; /* True deep tech space background */
            height: 100%;
            width: 100%;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0; /* Keeps it locked at the absolute background layer */
        }
    </style>
</head>
<body>

    <!-- No text overlays or elements. Strictly the visual background layer. -->
    <canvas id="hackerGrid"></canvas>

    <script>
        const canvas = document.getElementById('hackerGrid');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        // Grid Definition Variables
        const points = [];
        const cols = 50; 
        const rows = 40; 
        
        // 3D Camera Variables (Locks perspective math into focus)
        const FOV = 280; 
        const cameraZ = 380;
        const pitchAngle = 0.65; // High angle viewing perspective

        // Mouse Trajectory Settings
        const mouse = { x: null, y: null, prevX: null, prevY: null, radius: 150, velocity: 0 };
        
        window.addEventListener('mousemove', (e) => {
            if (mouse.x !== null) {
                // Measure speed of cursor to calculate distortion physics intensities
                mouse.velocity = Math.hypot(e.clientX - mouse.x, e.clientY - mouse.y);
            }
            mouse.prevX = mouse.x;
            mouse.prevY = mouse.y;
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mouseleave', () => { 
            mouse.x = null; mouse.y = null; 
        });

        // Seed 3D coordinate map structures
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                // Wide ground coordinates
                const x3d = (c - cols / 2) * 32;
                const z3d = (rows - r) * 20; 
                const baseHeight = -80; // Baseline altitude level

                points.push({
                    x3d: x3d,
                    y3d: baseHeight,
                    z3d: z3d,
                    origX3d: x3d,
                    origY3d: baseHeight,
                    origZ3d: z3d,
                    screenX: 0,
                    screenY: 0,
                    waveOffset: Math.random() * Math.PI * 2,
                    warpVelocity: 0 // Local kinetic structural deformation speed
                });
            }
        }

        // Transforms raw spatial coordinate metrics into a 3D perspective display
        function project(p) {
            const cosA = Math.cos(pitchAngle);
            const sinA = Math.sin(pitchAngle);

            // Matrix pitch tilt rotation math
            let rotY = p.y3d * cosA - p.z3d * sinA;
            let rotZ = p.y3d * sinA + p.z3d * cosA;

            rotZ += cameraZ;
            const scale = FOV / rotZ;

            p.screenX = canvas.width / 2 + p.x3d * scale;
            p.screenY = canvas.height / 2.2 - rotY * scale;
        }

        function step() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Decelerate cursor metrics smoothly
            mouse.velocity *= 0.95;

            // 1. Process physics updates for every junction node
            points.forEach(p => {
                p.waveOffset += 0.02;
                
                // Fine background idle hum vibration matrix
                let homeHeight = p.origY3d + (Math.sin(p.origX3d * 0.015 + p.waveOffset) * 6);
                let targetY = homeHeight;

                // Project points ahead to scan 2D mouse proximity boundaries
                project(p);

                if (mouse.x !== null && mouse.y !== null) {
                    const dx = p.screenX - mouse.x;
                    const dy = p.screenY - mouse.y;
                    const distance = Math.hypot(dx, dy);

                    if (distance < mouse.radius) {
                        // Intensity increases based on proximity and mouse kinetic speed 
                        const proximityFactor = (mouse.radius - distance) / mouse.radius;
                        const distortionForce = proximityFactor * (40 + Math.min(mouse.velocity * 2, 80));
                        
                        // Push grid mesh vertices downward dynamically based on vector force
                        targetY -= distortionForce;
                    }
                }

                // Apply spring elasticity back toward structural baseline configurations
                p.warpVelocity += (targetY - p.y3d) * 0.08;
                p.warpVelocity *= 0.85; // Drag friction force
                p.y3d += p.warpVelocity;

                // Update calculation sets with spatial transformations
                project(p);
            });

            // 2. Draw Wireframe Mesh Topography Connections
            ctx.lineWidth = 1.0;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const i = r * cols + c;
                    
                    // Depth alpha fades cleanly out as points move further towards the horizon line
                    const depthAlpha = 1 - (points[i].origZ3d / (rows * 20));
                    if (depthAlpha < 0.05) continue;

                    let baseAlpha = depthAlpha * 0.35;

                    // Pull right axis connections
                    if (c < cols - 1) {
                        ctx.strokeStyle = `rgba(255, 115, 0, ${baseAlpha})`;
                        ctx.beginPath();
                        ctx.moveTo(points[i].screenX, points[i].screenY);
                        ctx.lineTo(points[i + 1].screenX, points[i + 1].screenY);
                        ctx.stroke();
                    }
                    // Pull back axis connections
                    if (r < rows - 1) {
                        ctx.strokeStyle = `rgba(255, 136, 0, ${baseAlpha * 0.75})`;
                        ctx.beginPath();
                        ctx.moveTo(points[i].screenX, points[i].screenY);
                        ctx.lineTo(points[i + cols].screenX, points[i + cols].screenY);
                        ctx.stroke();
                    }
                }
            }

            // 3. Highlight Node Particle Overlays
            points.forEach(p => {
                const depthAlpha = 1 - (p.origZ3d / (rows * 20));
                if (depthAlpha < 0.1) return;

                let isNearMouse = false;
                if (mouse.x !== null && mouse.y !== null) {
                    const distance = Math.hypot(p.screenX - mouse.x, p.screenY - mouse.y);
                    if (distance < mouse.radius) isNearMouse = true;
                }

                ctx.beginPath();
                // Interactive points scale visually on high stress values
                const size = isNearMouse ? 3.0 : depthAlpha * 1.5;
                ctx.arc(p.screenX, p.screenY, Math.max(0.4, size), 0, Math.PI * 2);

                // Flare elements shift bright electric orange/white near the tracking path
                ctx.fillStyle = isNearMouse ? '#ffffff' : `rgba(255, 155, 0, ${depthAlpha})`;
                ctx.shadowBlur = isNearMouse ? 12 : 0;
                ctx.shadowColor = '#ff5100';
                ctx.fill();
            });

            ctx.shadowBlur = 0;
            requestAnimationFrame(step);
        }

        step();
    </script>
</body>
</html>
