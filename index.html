<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Grab Grid</title>
    <style>
        /* Forces canvas to fit the exact screen dimensions without scrollbars */
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #030712; /* Deep space-hacker navy */
            height: 100vh;
            width: 100vw;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing; /* Visual feedback when holding click */
        }
    </style>
</head>
<body>

    <canvas id="topDownGrid"></canvas>

    <script>
        const canvas = document.getElementById('topDownGrid');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        const points = [];
        const spacing = 35; // Grid density spacing (pixels between lines)
        
        // Track mouse states
        const mouse = { x: null, y: null, isPressed: false, radius: 180 };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mousedown', () => { mouse.isPressed = true; });
        window.addEventListener('mouseup', () => { mouse.isPressed = false; });
        window.addEventListener('mouseleave', () => { mouse.x = null; mouse.y = null; mouse.isPressed = false; });

        // Initialize points on a massive 2D matrix layout covering oversized screens
        const cols = Math.ceil(window.screen.width / spacing) + 4;
        const rows = Math.ceil(window.screen.height / spacing) + 4;

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const startX = (c - 2) * spacing;
                const startY = (r - 2) * spacing;

                points.push({
                    x: startX,
                    y: startY,
                    origX: startX,
                    origY: startY,
                    col: c,
                    row: r,
                    vx: 0, // Kinetic velocity tracking x
                    vy: 0  // Kinetic velocity tracking y
                });
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Process Node Physics 
            points.forEach(p => {
                let targetX = p.origX;
                let targetY = p.origY;

                // Grab logic: Pull node targets toward cursor ONLY if click is held down
                if (mouse.isPressed && mouse.x !== null && mouse.y !== null) {
                    const dx = p.x - mouse.x;
                    const dy = p.y - mouse.y;
                    const dist = Math.hypot(dx, dy);

                    if (dist < mouse.radius) {
                        const pullStrength = (mouse.radius - dist) / mouse.radius;
                        // Linearly pulls points directly into the cursor coordinates based on proximity
                        targetX += (mouse.x - p.x) * pullStrength * 0.85;
                        targetY += (mouse.y - p.y) * pullStrength * 0.85;
                    }
                }

                // Spring physics formulas to pull deformed grids back into normal alignment
                const springForceX = (targetX - p.x) * 0.07;
                const springForceY = (targetY - p.y) * 0.07;

                p.vx += springForceX;
                p.vy += springForceY;

                // Apply drag friction to prevent infinite shaking/wobbles
                p.vx *= 0.82;
                p.vy *= 0.82;

                p.x += p.vx;
                p.y += p.vy;
            });

            // 2. Draw Wireframe Layout lines
            ctx.lineWidth = 1.0;
            for (let i = 0; i < points.length; i++) {
                const p = points[i];

                // Right horizontal grid lines
                if (p.col < cols - 1 && points[i + 1]) {
                    ctx.strokeStyle = getLineStyle(p, points[i + 1]);
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(points[i + 1].x, points[i + 1].y);
                    ctx.stroke();
                }

                // Vertical bottom grid lines
                if (p.row < rows - 1 && points[i + cols]) {
                    ctx.strokeStyle = getLineStyle(p, points[i + cols]);
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(points[i + cols].x, points[i + cols].y);
                    ctx.stroke();
                }
            }

            // 3. Highlight Node Corners
            points.forEach(p => {
                let tensionAlpha = 0.25;
                if (mouse.isPressed && mouse.x !== null && mouse.y !== null) {
                    const dist = Math.hypot(p.x - mouse.x, p.y - mouse.y);
                    if (dist < mouse.radius) {
                        tensionAlpha = 0.9 - (dist / mouse.radius) * 0.6;
                    }
                }

                ctx.beginPath();
                ctx.arc(p.x, p.y, tensionAlpha > 0.4 ? 2.5 : 1.2, 0, Math.PI * 2);
                ctx.fillStyle = tensionAlpha > 0.4 ? '#ffffff' : `rgba(255, 140, 0, ${tensionAlpha})`;
                ctx.fill();
            });

            requestAnimationFrame(animate);
        }

        // Helper to adjust color tension on individual grid strands
        function getLineStyle(p1, p2) {
            let baseAlpha = 0.15; // Unmodified background opacity state

            if (mouse.isPressed && mouse.x !== null && mouse.y !== null) {
                const midX = (p1.x + p2.x) / 2;
                const midY = (p1.y + p2.y) / 2;
                const dist = Math.hypot(midX - mouse.x, midY - mouse.y);

                if (dist < mouse.radius) {
                    const factor = 1 - (dist / mouse.radius);
                    // Shifts color lines from dark orange to a hot glowing amber/white line matrix
                    return `rgba(255, ${130 + Math.floor(factor * 125)}, ${Math.floor(factor * 200)}, ${0.15 + factor * 0.65})`;
                }
            }
            return `rgba(255, 120, 0, ${baseAlpha})`;
        }

        animate();
    </script>
</body>
</html>
