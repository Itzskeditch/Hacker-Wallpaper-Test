<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Plexus Cyber Landscape</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #030812; /* Deep cyber dark background */
            height: 100%;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .interface {
            position: relative;
            z-index: 2;
            color: #ff9100;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            top: 15%;
            pointer-events: none;
            text-shadow: 0 0 8px #ff7b00;
        }
    </style>
</head>
<body>

    <div class="interface">
        <h2>CYBER LAYER CONNECTIONS ACTIVE</h2>
        <p>Hover to distort the grid mesh topology...</p>
    </div>

    <canvas id="networkCanvas"></canvas>

    <script>
        const canvas = document.getElementById('networkCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        // Network Configuration
        const points = [];
        const cols = 26; // Grid columns
        const rows = 18; // Grid rows
        const spacingX = canvas.width / (cols - 1);
        const spacingY = canvas.height / (rows - 1);

        // Mouse settings
        const mouse = { x: null, y: null, radius: 160 };
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        window.addEventListener('mouseleave', () => {
            mouse.x = null;
            mouse.y = null;
        });

        // Initialize node coordinates to form a 3D wave plane look
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                // Base coordinates
                const baseX = c * spacingX;
                // Skewing the rows downwards slightly creates a depth perspective layout
                const baseY = r * spacingY + (Math.sin(c * 0.5) * 20); 
                
                points.push({
                    x: baseX,
                    y: baseY,
                    baseX: baseX,
                    baseY: baseY,
                    // Phase offset for organic slow idle wave motion
                    phase: Math.random() * Math.PI * 2,
                    speed: 0.02 + Math.random() * 0.02
                });
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 1. Update Positions (Wavy idle behavior + Mouse manipulation)
            points.forEach(p => {
                p.phase += p.speed;
                // Idle background breathing movement
                let targetX = p.baseX + Math.sin(p.phase) * 6;
                let targetY = p.baseY + Math.cos(p.phase) * 12;

                // Mouse Interaction Logic: Push nodes away or pull them down
                if (mouse.x !== null && mouse.y !== null) {
                    const dx = targetX - mouse.x;
                    const dy = targetY - mouse.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < mouse.radius) {
                        const force = (mouse.radius - dist) / mouse.radius;
                        // Magnifies node shift direction relative to your pointer position
                        targetX += (dx / dist) * force * 35;
                        targetY += (dy / dist) * force * 45;
                    }
                }

                // Smooth out calculation shifts
                p.x += (targetX - p.x) * 0.1;
                p.y += (targetY - p.y) * 0.1;
            });

            // 2. Draw Network Lines (Connecting nodes horizontally and vertically)
            ctx.lineWidth = 1.2;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const i = r * cols + c;

                    // Connect to adjacent node on the right
                    if (c < cols - 1) {
                        drawMeshLine(points[i], points[i + 1]);
                    }
                    // Connect to adjacent node underneath
                    if (r < rows - 1) {
                        drawMeshLine(points[i], points[i + cols]);
                    }
                }
            }

            // 3. Draw Nodes (Glow points)
            points.forEach(p => {
                let isGlowing = false;
                if (mouse.x !== null && mouse.y !== null) {
                    const dist = Math.hypot(p.x - mouse.x, p.y - mouse.y);
                    if (dist < mouse.radius) isGlowing = true;
                }

                ctx.beginPath();
                ctx.arc(p.x, p.y, isGlowing ? 4 : 2, 0, Math.PI * 2);
                // Glow fields match the orange/amber highlights of the image
                ctx.fillStyle = isGlowing ? '#ffae00' : '#d16a00';
                ctx.shadowBlur = isGlowing ? 12 : 0;
                ctx.shadowColor = '#ff8800';
                ctx.fill();
            });
            
            ctx.shadowBlur = 0; // Reset canvas glow states
            requestAnimationFrame(animate);
        }

        function drawMeshLine(p1, p2) {
            let proximityAlpha = 0.12; // Dim default grid line opacity
            
            if (mouse.x !== null && mouse.y !== null) {
                const midX = (p1.x + p2.x) / 2;
                const midY = (p1.y + p2.y) / 2;
                const dist = Math.hypot(midX - mouse.x, midY - mouse.y);
                
                if (dist < mouse.radius) {
                    // Lines flare up explicitly if they approach the pointer
                    proximityAlpha = 0.65 - (dist / mouse.radius) * 0.5;
                }
            }

            ctx.strokeStyle = `rgba(255, 136, 0, ${proximityAlpha})`;
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
        }

        animate();
    </script>
</body>
</html>
